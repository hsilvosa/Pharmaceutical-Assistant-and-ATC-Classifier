[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-assistant"
version = "1.0.0"
description = "Spanish Pharmaceutical & Medical Assistant & BETO ATC Classifier built on AEMPS CIMA Research Dataset"
readme = "README.md"
authors = [
    { name = "AI Research Team", email = "research@example.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "streamlit>=1.32.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black",
    "ruff"
]
