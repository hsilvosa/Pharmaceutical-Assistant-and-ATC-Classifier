[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-assistant"
version = "1.1.0"
description = "Spanish Pharmaceutical & Medical Assistant & BETO ATC Classifier built on AEMPS CIMA Research Dataset"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Research Team", email = "research@example.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "streamlit>=1.32.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.27.0",
    "lancedb>=0.20.0",
    "numpy>=1.26.0",
    "pyarrow>=16.0.0",
    "pydantic-settings>=2.6.0",
    "uvicorn>=0.32.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black",
    "ruff"
]

[project.scripts]
cima-rag = "src.rag.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.rag" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local_model: requires downloaded models and a running llama.cpp server"]

[tool.ruff]
line-length = 100
target-version = "py311"
